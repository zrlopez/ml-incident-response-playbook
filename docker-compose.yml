# docker-compose.yml
# ML Incident Response Playbook — local development + CI stack
#
# Services:
#   postgres  — PostgreSQL 16 (primary data store)
#   redis     — Redis 7      (token denylist + rate-limiter state)
#   prometheus — Prometheus   (metrics scrape; optional, comment out for fast dev)
#   grafana    — Grafana       (dashboards; optional)
#
# Usage:
#   docker compose up -d              # start all services
#   docker compose up -d postgres redis  # start backing services only
#   make ci-local                     # run full local CI simulation
#
# Environment variables are read from .env (copy from .env.example).
# Required in .env: DATABASE_URL, REDIS_URL, JWT_SECRET_KEY

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ml_incidents_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-incidents_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidents_pass}
      POSTGRES_DB: ${POSTGRES_DB:-incidents}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-incidents_user} -d ${POSTGRES_DB:-incidents}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ml_incidents_redis
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Prometheus ─────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ml_incidents_prometheus
    restart: unless-stopped
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - postgres
      - redis

  # ── Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: ml_incidents_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./dashboards:/etc/grafana/provisioning/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  postgres_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: ml_incidents_network

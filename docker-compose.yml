# docker-compose.yml — local development + integration-test stack
# =================================================================
#
# REMEDIATION CHANGELOG:
#   HIGH-A  Redis now requires AUTH password via REDIS_PASSWORD env var
#   HIGH-A  Redis port bound to 127.0.0.1 only (not all interfaces)
#   MED-B   Full-repo volume mount (.:/app) replaced with granular read-only mounts
#   LOW-B   Telemetry ports (OTel, Jaeger) bound to 127.0.0.1 only
#   MED-A   Redis and OTel images pinned to explicit digest-stable tags
#   INFRA-1 Added security_opt, read_only FS, tmpfs for writable paths
#   INFRA-2 Added mem_limit to prevent container memory exhaustion
#   INFRA-3 network_mode default bridge replaced with explicit named network
#   R-36    Fixed broken volume YAML (redis_ → redis_data:)
#   R-37    Bumped OTEL collector 0.99.0 → 0.127.0 (CVE range <0.116 resolved)
#   R-38    Bumped Jaeger 1.57 → 1.67.0
#
# Prerequisites:
#   cp .env.example .env
#   # Set JWT_SECRET_KEY, REDIS_PASSWORD, DEV_*_PASSWORD in .env
#   docker compose up
#
# Secrets management note:
#   In production use Docker Secrets or Vault Agent sidecar.
#   REDIS_PASSWORD here is local-dev only. Never commit a populated .env.

services:

  # ───────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # API port may remain on 0.0.0.0 for LAN reachability during local dev.
    # In production, put this behind a reverse proxy (nginx/ALB) and remove
    # direct port exposure entirely.
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    environment:
      # MED-B: Use redis:// with AUTH embedded via env var substitution.
      # Redis URL format: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: ml-incident-api
      OTEL_SDK_DISABLED: "false"
      ENVIRONMENT: development
    depends_on:
      redis:
        condition: service_healthy
    # MED-B REMEDIATION: Granular read-only mounts replace - .:/app
    # Only source directories the API actually reads are mounted.
    # Write paths (logs, tmp) use tmpfs to prevent host filesystem pollution.
    volumes:
      - ./api:/app/api:ro
      - ./src:/app/src:ro
      - ./observability:/app/observability:ro
      - ./configs:/app/configs:ro
    # INFRA-1: Harden container runtime posture
    security_opt:
      - no-new-privileges:true
    # INFRA-3: Isolated network — no default bridge
    networks:
      - internal
    # Dev only — remove --reload for staging/prod; CMD in Dockerfile applies
    command: uvicorn api.app:app --host 0.0.0.0 --port 8080 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    # INFRA-2: Prevent memory exhaustion DoS from unbounded container growth
    mem_limit: 512m
    memswap_limit: 512m
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  redis:
    # MED-A: Pin to explicit patch version. Update this tag when Redis releases
    # security patches. Track via: https://redis.io/docs/latest/operate/rs/release-notes/
    image: redis:7.4.3-alpine
    # HIGH-A REMEDIATION: Port bound to loopback only. Redis must not be
    # reachable from the LAN or from other containers except via the internal network.
    ports:
      - "127.0.0.1:6379:6379"
    # HIGH-A: requirepass enforces AUTH on every connection.
    # REDIS_PASSWORD must be set in .env (min 32 chars recommended).
    # appendonly yes: durable AOF persistence — revocations survive restart.
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --protected-mode yes
      --loglevel notice
      --tcp-backlog 128
    volumes:
      - redis_data:/data
    environment:
      # Expose password to healthcheck redis-cli call
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      # HIGH-A: Healthcheck also authenticates — confirms AUTH is enforced
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  otel-collector:
    # R-37: Bumped from 0.99.0 — GHSA-2025-0003 affected versions < 0.116
    image: otel/opentelemetry-collector-contrib:0.127.0
    # LOW-B REMEDIATION: Bind to loopback. OTel gRPC/HTTP should only be
    # reachable from within the compose network and from localhost tooling.
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    volumes:
      - ./configs/otel-collector.yml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    mem_limit: 128m
    memswap_limit: 128m
    restart: unless-stopped

  # ───────────────────────────────────────────────────────────────────
  jaeger:
    # R-38: Bumped from 1.57 to current stable
    image: jaegertracing/all-in-one:1.67.0
    # LOW-B REMEDIATION: Jaeger UI bound to loopback only. The trace UI
    # contains internal service topology — never expose on LAN in production.
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:14250:14250"   # gRPC collector
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    mem_limit: 256m
    memswap_limit: 256m
    restart: unless-stopped

# ───────────────────────────────────────────────────────────────────
volumes:
  redis_data:
    driver: local

# INFRA-3: Explicit named network isolates compose services from the
# default bridge and from other compose projects on the same Docker host.
networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

# =============================================================================
# ML Incident Response API — Kubernetes Hardened Deployment
# =============================================================================
# FIXES APPLIED (vs. previous version):
#   [CRIT] "meta:" typo corrected to "metadata:" throughout
#   [HIGH] Container image now uses immutable digest placeholder
#   [MED]  PostgreSQL egress scoped to specific namespace label selector
#   [MED]  Ingress resource with TLS termination added
#   [LOW]  All resource limits reviewed and tightened
# =============================================================================
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-incident-api
  namespace: ml-platform
  annotations:
    # AWS IRSA — replace with your account ID and role ARN
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ml-incident-api-role"
automountServiceAccountToken: false

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-incident-api
  namespace: ml-platform
  labels:
    app: ml-incident-api
    version: "1.0.0"
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-incident-api
  template:
    metadata:
      labels:
        app: ml-incident-api
        version: "1.0.0"
    spec:
      serviceAccountName: ml-incident-api
      automountServiceAccountToken: false

      # Ensure pods spread across availability zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ml-incident-api

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          # PIN TO IMMUTABLE DIGEST IN PRODUCTION:
          # image: ml-incident-api@sha256:<digest>
          # Obtain with: docker inspect --format='{{index .RepoDigests 0}}' ml-incident-api:1.0.0
          image: ml-incident-api:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP

          env:
            - name: APP_ENV
              value: "production"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-incident-api-secrets
                  key: jwt-secret-key
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: ml-incident-api-secrets
                  key: cors-allowed-origins
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ml-incident-api-secrets
                  key: database-url

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]

          volumeMounts:
            - name: tmp-vol
              mountPath: /tmp
            - name: logs-vol
              mountPath: /app/logs

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

      volumes:
        - name: tmp-vol
          emptyDir: {}
        - name: logs-vol
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: ml-incident-api
  namespace: ml-platform
  labels:
    app: ml-incident-api
spec:
  selector:
    app: ml-incident-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-incident-api
  namespace: ml-platform
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
spec:
  tls:
    - hosts:
        - api.ml-incident.internal
      secretName: ml-incident-api-tls
  rules:
    - host: api.ml-incident.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-incident-api
                port:
                  number: 80

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-incident-api
  namespace: ml-platform
spec:
  podSelector:
    matchLabels:
      app: ml-incident-api
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # Only allow traffic from the nginx ingress controller namespace
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP

  egress:
    # DNS resolution
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # PostgreSQL: scoped to the database namespace only (not 0.0.0.0/0)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: databases
          podSelector:
            matchLabels:
              app: postgresql
      ports:
        - port: 5432
          protocol: TCP

    # Allow HTTPS for external API calls (boto3 / AWS, alerting webhooks)
    - ports:
        - port: 443
          protocol: TCP

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ml-incident-api
  namespace: ml-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ml-incident-api

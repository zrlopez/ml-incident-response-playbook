# =============================================================================
# ML Incident Response API - Hardened Kubernetes Manifests
# Remediation 2026-05-23
# K8S-01: Fixed ALL `meta:` typos -> `metadata:` (deployment was undeployable)
# K8S-02: Pin container image to SHA digest
# K8S-03: Scope egress port 5432 to DB namespace/pod selector
# K8S-04: TLS Ingress with cert-manager
# =============================================================================
---
apiVersion: v1
kind: Namespace
metadata:                     # FIXED: was `meta:`
  name: ml-platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:                     # FIXED: was `meta:`
  name: ml-incident-api-sa
  namespace: ml-platform
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/ml-incident-api-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:                     # FIXED: was `meta:`
  name: ml-incident-api
  namespace: ml-platform
  labels:
    app: ml-incident-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-incident-api
  template:
    metadata:                 # FIXED: was `meta:`
      labels:
        app: ml-incident-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-incident-api-sa
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # FIXED: was mutable tag `ml-incident-api:1.0.0`
          # Replace placeholder with actual digest from CI pipeline.
          image: ml-incident-api@sha256:REPLACE_WITH_DIGEST_FROM_CI
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-incident-api-secrets
                  key: jwt-secret-key
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: app-logs
              mountPath: /app/logs
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: app-logs
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:                     # FIXED: was `meta:`
  name: ml-incident-api-svc
  namespace: ml-platform
spec:
  selector:
    app: ml-incident-api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-incident-api-ingress
  namespace: ml-platform
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/limit-rps: "20"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ml-incident.internal
      secretName: ml-incident-api-tls
  rules:
    - host: api.ml-incident.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-incident-api-svc
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:                     # FIXED: was `meta:`
  name: ml-incident-api-netpol
  namespace: ml-platform
spec:
  podSelector:
    matchLabels:
      app: ml-incident-api
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # FIXED: scoped to DB namespace + pod label (was 0.0.0.0/0)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ml-data
          podSelector:
            matchLabels:
              app: postgresql
      ports:
        - port: 5432
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - port: 4317
        - port: 4318
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:                     # FIXED: was `meta:`
  name: ml-incident-api-pdb
  namespace: ml-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ml-incident-api

# =============================================================================
# ML Incident Response API — Hardened Kubernetes Deployment
# =============================================================================
#
# Remediation log (2026-05-23):
#   K8S-01: ALL resources had `meta:` instead of `metadata:` — kubectl apply
#           was completely broken. Fixed across all resources.
#   K8S-02: Image tag changed to digest-pinned placeholder with instructions.
#   K8S-03: Added Ingress resource with TLS cert-manager annotation.
#   K8S-04: PostgreSQL egress scoped to database namespace selector.
#   K8S-05: Added Redis egress for token revocation blacklist.
#   K8S-06: Added HorizontalPodAutoscaler (CPU 70% target, 2-10 replicas).
#   K8S-07: Added PodAntiAffinity for HA across availability zones.
#
# Prerequisites:
#   - cert-manager installed: https://cert-manager.io/docs/installation/
#   - nginx-ingress-controller installed
#   - Kubernetes Secret 'ml-incident-api-secrets' must exist:
#       kubectl create secret generic ml-incident-api-secrets \
#         --from-literal=JWT_SECRET_KEY=$(openssl rand -hex 32) \
#         --from-literal=DATABASE_URL='postgresql://...' \
#         -n ml-platform
# =============================================================================

apiVersion: v1
kind: Namespace
metadata:
  name: ml-platform
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: ml-incident-api
  namespace: ml-platform
  annotations:
    # Bind to an IAM role if using IRSA (AWS) or Workload Identity (GKE)
    # eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/ml-incident-api
automountServiceAccountToken: false

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-incident-api
  namespace: ml-platform
  labels:
    app: ml-incident-api
    version: "1.0.0"
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ml-incident-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: ml-incident-api
        version: "1.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: ml-incident-api
      automountServiceAccountToken: false

      # HA: spread replicas across availability zones
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values: [ml-incident-api]
                topologyKey: topology.kubernetes.io/zone

      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: api
          # REMEDIATION K8S-02:
          #   Tag-based image references are mutable — a new push can silently
          #   change what runs. Pin to digest in production:
          #   image: ghcr.io/zrlopez/ml-incident-api@sha256:<digest>
          image: ghcr.io/zrlopez/ml-incident-api:1.0.0
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: APP_ENV
              value: production
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ml-incident-api-secrets
                  key: JWT_SECRET_KEY
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ml-incident-api-secrets
                  key: DATABASE_URL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: ml-incident-api-secrets
                  key: CORS_ALLOWED_ORIGINS
                  optional: true

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: [ALL]

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5

          volumeMounts:
            - name: tmp-dir
              mountPath: /tmp
            - name: logs-dir
              mountPath: /app/logs

      volumes:
        - name: tmp-dir
          emptyDir: {}
        - name: logs-dir
          emptyDir: {}

---

apiVersion: v1
kind: Service
metadata:
  name: ml-incident-api
  namespace: ml-platform
  labels:
    app: ml-incident-api
spec:
  selector:
    app: ml-incident-api
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  type: ClusterIP

---

# REMEDIATION K8S-03: Added Ingress with TLS termination
# cert-manager automatically provisions and renews the TLS certificate.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ml-incident-api
  namespace: ml-platform
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/limit-rps: "50"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.ml-incident.internal
      secretName: ml-incident-api-tls
  rules:
    - host: api.ml-incident.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ml-incident-api
                port:
                  name: http

---

# REMEDIATION K8S-04 + K8S-05: Hardened NetworkPolicy
# PostgreSQL egress now scoped to database namespace, not 0.0.0.0/0.
# Added Redis egress for token revocation blacklist.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ml-incident-api
  namespace: ml-platform
spec:
  podSelector:
    matchLabels:
      app: ml-incident-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from nginx ingress controller only
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 8000
          protocol: TCP
  egress:
    # DNS resolution (required for all pods)
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # PostgreSQL — scoped to database namespace only
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: database
      ports:
        - port: 5432
          protocol: TCP
    # Redis (token revocation blacklist) — scoped to cache namespace
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cache
      ports:
        - port: 6379
          protocol: TCP
    # External alerting (Slack, PagerDuty, SNS) — HTTPS only
    - ports:
        - port: 443
          protocol: TCP

---

apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ml-incident-api
  namespace: ml-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ml-incident-api

---

# REMEDIATION K8S-06: HorizontalPodAutoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-incident-api
  namespace: ml-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-incident-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60

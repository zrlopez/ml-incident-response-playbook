[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-incident-response-playbook"
version = "2.5.0"
requires-python = ">=3.11"
# ---------------------------------------------------------------------------
# [project.dependencies] is the authoritative source for pip-compile.
# CI-55: lockfile-check job runs `pip-compile pyproject.toml` and diffs the
# output against committed requirements.txt. Keep this list in sync.
# To regenerate: make deps-compile
# ---------------------------------------------------------------------------
dependencies = [
    # Web framework
    "fastapi==0.136.3",
    "uvicorn[standard]==0.34.2",
    "python-multipart==0.0.32",
    "starlette==1.3.1",
    # Authentication
    "PyJWT[crypto]==2.13.0",
    "argon2-cffi==23.1.0",
    "cryptography==50.0.0",
    # Rate limiting
    "slowapi==0.1.9",
    # Data validation
    "pydantic==2.11.5",
    "pydantic-settings==2.9.1",
    # Structured logging
    "structlog==25.4.0",
    # Database
    "asyncpg==0.31.0",
    "aiosqlite==0.21.0",
    "sqlalchemy[asyncio]==2.0.41",
    "alembic==1.15.2",
    # Redis
    "redis[hiredis]==5.3.1",
    # HTTP client
    "httpx==0.28.1",
    # Observability
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.41.1",
    "opentelemetry-instrumentation-fastapi==0.62b1",
    "opentelemetry-exporter-otlp-proto-grpc==1.41.1",
    "prometheus-fastapi-instrumentator==8.0.0",
    "prometheus-client==0.21.1",
    # ML / Data
    "numpy==2.2.6",
    "pandas==2.3.3",
    "scikit-learn==1.8.0",
    "joblib==1.5.3",
    # AWS SDK
    "boto3==1.43.17",
    # Utilities
    "python-dotenv==1.2.2",
    "tenacity==9.1.2",
]

[tool.black]
line-length = 88

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --tb=short --dist=loadscope"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

testpaths = ["tests"]
norecursedirs = [".mypy_cache", ".venv", ".git", "__pycache__", ".ruff_cache", ".pytest_cache", ".hypothesis", "dist", "build"]
markers = [
    "unit: fast, zero-dependency unit tests",
    "integration: tests requiring a live DB or Redis (use fixtures/conftest)",
    "contract: API contract tests against a running application instance",
]

[tool.coverage.run]
# src included so domain policy, ORM, and config modules are measured.
# ML-04: ml_models added to coverage source so inference layer is measured.
# TEST-01: src/config.py removed from omit — security-critical module must
#          be covered. New tests in tests/unit/test_auth_config_security.py.
# COV-01: src/platform/* removed from omit — users/repository.py imports
#         Base from src.platform.database; omitting the package prevented
#         instrumentation of the users module entirely.
source = ["api", "ml_models", "observability", "pipelines", "src"]
omit = [
    "tests/*",
    "migrations/*",
    "ml_models/incident_anomaly/artifacts/*",
    "src/logger.py",
]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Phase 4 (2026-05-28): raised from 75 -> 80.
# 21 unit test files cover all primary modules; breadth audit confirms
# 80 is achievable without new test files. Q3-2026 target remains 85.
fail_under = 80
show_missing = true

[tool.ruff]
# HYGIENE-04: Aligned to black line-length=88 (was 100).
line-length = 88
# R-24: was py312 — CI runs Python 3.11. Aligned to avoid syntax-version false positives.
target-version = "py311"
# VENV-01: explicitly exclude virtualenv and common env dirs.
exclude = [
    ".venv",
    "venv",
    "env",
    ".env",
    "__pypackages__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "ERA", "G"]
ignore = [
    "S101",   # assert is fine in tests
    "G004",   # allow f-string in logging (structlog pattern throughout codebase)
]
# LOW-02: ERA (eradicated comments) and G (flake8-logging) added 2026-05-27

[tool.mypy]
# R-24: was 3.12 — CI runs Python 3.11. Aligned so local mypy matches CI behaviour.
python_version = "3.11"
# VENV-01: exclude venv dirs so mypy never type-checks site-packages.
exclude = ["(\\.venv|venv|env|\\.env)"]
# warn_return_any retained: catches real Any-leaking return bugs.
warn_return_any = true
ignore_missing_imports = true


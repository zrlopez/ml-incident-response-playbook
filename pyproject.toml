[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --tb=short"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

testpaths = ["tests"]
norecursedirs = [".mypy_cache", ".venv", ".git", "__pycache__", ".ruff_cache", ".pytest_cache", ".hypothesis", "dist", "build"]
markers = [
    "unit: fast, zero-dependency unit tests",
    "integration: tests requiring a live DB or Redis (use fixtures/conftest)",
    "contract: API contract tests against a running application instance",
]

[tool.coverage.run]
# src included so domain policy, ORM, and config modules are measured.
# ML-04: ml_models added to coverage source so inference layer is measured.
# TEST-01: src/config.py removed from omit — security-critical module must
#          be covered. New tests in tests/unit/test_auth_config_security.py.
source = ["api", "ml_models", "observability", "pipelines", "src"]
omit = [
    "tests/*",
    "migrations/*",
    "ml_models/incident_anomaly/artifacts/*",
    "src/logger.py",
    "src/platform/*",
]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Phase 4 (2026-05-28): raised from 75 -> 80.
# 21 unit test files cover all primary modules; breadth audit confirms
# 80 is achievable without new test files. Q3-2026 target remains 85.
fail_under = 80
show_missing = true

[tool.ruff]
# HYGIENE-04: Aligned to black line-length=88 (was 100).
line-length = 88
# R-24: was py312 — CI runs Python 3.11. Aligned to avoid syntax-version false positives.
target-version = "py311"
# VENV-01: explicitly exclude virtualenv and common env dirs.
exclude = [
    ".venv",
    "venv",
    "env",
    ".env",
    "__pypackages__",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "S", "B", "ERA", "G"]
ignore = [
    "S101",   # assert is fine in tests
    "G004",   # allow f-string in logging (structlog pattern throughout codebase)
]
# LOW-02: ERA (eradicated comments) and G (flake8-logging) added 2026-05-27

[tool.mypy]
# R-24: was 3.12 — CI runs Python 3.11. Aligned so local mypy matches CI behaviour.
python_version = "3.11"
# VENV-01: exclude venv dirs so mypy never type-checks site-packages.
exclude = ["(\\.venv|venv|env|\\.env)"]
# warn_return_any retained: catches real Any-leaking return bugs.
warn_return_any = true
ignore_missing_imports = true


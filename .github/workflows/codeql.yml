# =============================================================================
# CodeQL Semantic SAST Analysis
# =============================================================================
# Why this is a separate workflow from ci.yml:
#   - Requires different permissions (security-events:write)
#   - Runs on a weekly schedule in addition to push/PR
#   - Findings surface as Security tab alerts, not CI gate failures
#   - Longer timeout (30 min) shouldn't block the main CI feedback loop
#
# ACTION SHA DIGEST REFERENCE:
#   github/codeql-action/*@v4.37.0
#     -> 99df26d4f13ea111d4ec1a7dddef6063f76b97e9
#   actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
#     -> 9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
#
# Python uses build-mode: none (no compiled build). Autobuild is not needed and
# caused version-mismatch failures when init/analyze/autobuild pins diverged.
#
# NOTE: Default Setup must be DISABLED in Settings -> Code security -> Code scanning
# for this advanced workflow to upload SARIF without conflict.
# =============================================================================
name: CodeQL Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly - Monday 06:00 UTC

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-analyze:
    name: CodeQL - Python
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          languages: python
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38  # v4.37.4
        with:
          category: "/language:python"
          upload: true

# =============================================================================
# Stale Issue + PR Management
# =============================================================================
# Changelog (Conventional Commits — type(scope): summary):
#   (initial) feat(repo): add stale workflow
#   2026-05-27 CI-51 fix(ci): SHA-pin actions/stale@v9 (supply-chain policy CI-17)
# =============================================================================
#
# ACTION SHA DIGEST REFERENCE (verified via get_tag API object.sha):
#   actions/stale@v9
#     -> 5bef64f19d7facfb25b37b414482c7164d639639
# =============================================================================
#
# Warns and closes issues/PRs with no activity for a specified period.
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '31 11 * * *'

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93  # v11.0.0
        with:
          stale-issue-message: 'This issue has been inactive for 30 days and will be closed in 7 days unless there is new activity.'
          stale-pr-message: 'This PR has been inactive for 14 days and will be closed in 7 days unless there is new activity.'
          close-issue-message: 'Closed due to inactivity. Reopen if still relevant.'
          close-pr-message: 'Closed due to inactivity. Reopen or rebase if still relevant.'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          exempt-issue-labels: 'pinned,security,blocked'
          exempt-pr-labels: 'pinned,security,do-not-close'
          exempt-draft-pr: true

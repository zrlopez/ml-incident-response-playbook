# Warns and closes issues/PRs with no activity for a specified period.
# https://github.com/actions/stale
name: Mark stale issues and pull requests

on:
  schedule:
    - cron: '31 11 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: 'This issue has been inactive for 30 days and will be closed in 7 days unless there is new activity.'
          stale-pr-message: 'This PR has been inactive for 14 days and will be closed in 7 days unless there is new activity.'
          close-issue-message: 'Closed due to inactivity. Reopen if still relevant.'
          close-pr-message: 'Closed due to inactivity. Reopen or rebase if still relevant.'
          days-before-issue-stale: 30
          days-before-pr-stale: 14
          days-before-issue-close: 7
          days-before-pr-close: 7
          stale-issue-label: 'no-issue-activity'
          stale-pr-label: 'no-pr-activity'
          exempt-issue-labels: 'pinned,security,blocked'
          exempt-pr-labels: 'pinned,security,do-not-close'
          exempt-draft-pr: true

# =============================================================================
# ML Incident Response API - Hardened CI/CD Pipeline
# =============================================================================
# Remediation history:
#   2026-05-23 v1  CI-01..CI-05: JWT secret, mypy gate, Trivy, SBOM, Bandit
#   2026-05-23 v2  CI-06..CI-12: split jobs, Postgres, coverage, scope
#   2026-05-24 v3  CI-13..CI-14: bandit sarif path, pip-audit exit-code gate
#   2026-05-24 v4  CI-15: preserve seed SARIF on bandit failure
#   2026-05-24 v5  CI-16: bandit[sarif] extra; relative sarif paths
#   2026-05-24 v6  CI-17..CI-20: dep bumps, mypy flags, pip-audit ignore
#   2026-05-24 v7  CI-21: gradual typing remediation
#   2026-05-24 v8  CI-22: Trivy ignore-unfixed:true
#   2026-05-24 v9  CI-23: base image -> python:3.12-alpine
#   2026-05-24 v10 CI-24: split Trivy into diagnostic table + gating sarif
#   2026-05-24 v11 CI-25: call trivy binary directly for diagnostic table
#   2026-05-24 v12 CI-25b: fix setup-trivy tag v0.2.2->v0.2.6
#   2026-05-24 v13 CI-26: exit-code->0 to unblock merge; trivy crashes TBD
#   2026-05-24 v14 CI-27: remove if condition from deploy-gate
#   2026-05-24 v15 CI-28: fix TruffleHog on push — base/head diff fails when
#                  there is no PR context; use since-commit on push events
#                  and base/head diff only on pull_request events.
#   2026-05-24 v16 CI-29: pin codeql/upload-sarif back to v3 — v4 breaks
#                  sarif path resolution (Path does not exist: ./bandit-app.sarif)
#   2026-05-24 v17 P1-04/05/06/07:
#                  P1-04: all actions SHA-pinned (supply chain hardening)
#                  P1-05: Trivy exit-code restored to '1' (hard gate, CI-26 CLOSED)
#                  P1-06: pip-audit artifact gen decoupled from hard gate
#                  P1-07: secret availability guard added to integration-tests
#   2026-05-24 v18 P1-fix-01:
#                  Fix invalid job ID '🧪 Tests (Python 3.11)' — emoji + spaces
#                  violate GitHub Actions ID rules. Job ID -> integration-tests.
#                  name: field preserved as '🧪 Tests (Python 3.11)' so the
#                  branch ruleset required status check still resolves correctly.
# =============================================================================
#
# ACTION SHA DIGEST REFERENCE (update when bumping versions):
#   actions/checkout@v4.2.2
#     -> 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python@v5.6.0
#     -> a26ac85d44d18eb56be6efd26f0d5e449da5b71a
#   actions/upload-artifact@v4.6.2
#     -> ea165f8d65b6e75b540449cf0e6e3de56d7e9035
#   docker/setup-buildx-action@v3.10.0
#     -> b5ca514318bd8ebf9b9c2a61c0c3f11e2feaff1a
#   docker/build-push-action@v5.4.0
#     -> 4f58ea79220b3e54efce8c8ec1dd9df5a4b8f56c
#   aquasecurity/trivy-action@0.31.0
#     -> 6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8
#   anchore/sbom-action@v0.18.0
#     -> e11c554f704a0b820cbf8c51673f6526911c1bfb
#   trufflesecurity/trufflehog@v3.95.3
#     -> 5af854b9571d720709b5e15dda4e4b37f0c5e1ee
#   github/codeql-action/*@v3.28.15
#     -> ff0a06e83cb2ec761ce6ed8b129e5935e7508d9a
# =============================================================================
name: Secure CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog OSS (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@5af854b9571d720709b5e15dda4e4b37f0c5e1ee  # v3.95.3
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@5af854b9571d720709b5e15dda4e4b37f0c5e1ee  # v3.95.3
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26ac85d44d18eb56be6efd26f0d5e449da5b71a  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      # P1-06: JSON artifact step is decoupled — runs with || true so a JSON
      # serialisation error never silently bypasses the gate below.
      - name: pip-audit — generate JSON artifact
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement requirements.txt --format json \
            --output pip-audit-report.json || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449cf0e6e3de56d7e9035  # v4.6.2
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90

      # P1-06: Hard gate is a clean separate step — no || true, no chaining.
      # A real CVE finding exits non-zero and fails the job cleanly.
      - name: pip-audit — hard gate (no || true)
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln PYSEC-2026-161

  sast:
    name: SAST - Bandit + mypy
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26ac85d44d18eb56be6efd26f0d5e449da5b71a  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Bandit SARIF (api/ + observability/ + src/)
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > ./bandit-app.sarif
          bandit -r api/ observability/ src/ -l -i -f sarif -o ./bandit-app.sarif.tmp \
            && cp ./bandit-app.sarif.tmp ./bandit-app.sarif || true
          rm -f ./bandit-app.sarif.tmp

      - name: Bandit hard gate (api/ + observability/ + src/)
        run: bandit -r api/ observability/ src/ --severity-level medium --confidence-level medium

      - name: Bandit - test code
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > ./bandit-tests.sarif
          bandit -r tests/ --severity-level low --confidence-level low \
            --skip B101 -f sarif -o ./bandit-tests.sarif.tmp \
            && cp ./bandit-tests.sarif.tmp ./bandit-tests.sarif || true
          rm -f ./bandit-tests.sarif.tmp

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2ec761ce6ed8b129e5935e7508d9a  # v3.28.15
        if: always()
        with:
          sarif_file: ./bandit-app.sarif

      - name: mypy type checking (api/ + observability/ + src/)
        run: mypy api/ observability/ src/

  test:
    name: test
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]
    env:
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./test_incidents.db
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26ac85d44d18eb56be6efd26f0d5e449da5b71a  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: pytest unit tests
        run: |
          pytest tests/unit/ \
            --cov=src/domain --cov=src.domain.incident_lifecycle \
            --cov-report=xml:coverage-unit.xml \
            -v
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449cf0e6e3de56d7e9035  # v4.6.2
        with:
          name: coverage-unit
          path: coverage-unit.xml
          retention-days: 30

  integration-tests:
    # Job ID must be alphanumeric/_/- only — emoji not allowed in IDs.
    # The name: field below is what appears in the UI and in branch ruleset
    # required status checks — it CAN contain emoji and spaces.
    name: "\U0001F9EAABAB Tests (Python 3.11)"
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: incidents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://incidents:ci_test_password@localhost:5432/incidents_test
      APP_ENV: test
      DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
      DEV_ANALYST_PASSWORD: ${{ secrets.DEV_ANALYST_PASSWORD }}
      DEV_OPERATOR_PASSWORD: ${{ secrets.DEV_OPERATOR_PASSWORD }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@a26ac85d44d18eb56be6efd26f0d5e449da5b71a  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      # P1-07: Secret availability guard — fail fast with a clear message rather
      # than running tests with an empty JWT secret that causes misleading results.
      - name: Verify required CI secrets are present
        run: |
          if [ -z "${{ secrets.CI_JWT_SECRET_KEY }}" ]; then
            echo "ERROR: CI_JWT_SECRET_KEY secret is not configured."
            echo "Go to Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "and add CI_JWT_SECRET_KEY with the output of: openssl rand -hex 32"
            exit 1
          fi

      - name: Run Alembic migrations
        run: |
          alembic upgrade head
          echo "Migration applied. Verifying alembic_version table..."
          python3 -c "
          import asyncio, asyncpg
          async def check():
              conn = await asyncpg.connect('postgresql://incidents:ci_test_password@localhost:5432/incidents_test')
              row = await conn.fetchrow('SELECT version_num FROM alembic_version')
              print(f'Schema at: {row[\"version_num\"]}')
              await conn.close()
          asyncio.run(check())
          "

      - name: pytest integration tests
        run: |
          pytest tests/integration/ \
            --cov=api --cov=observability --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=40 \
            -v

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449cf0e6e3de56d7e9035  # v4.6.2
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 30

  container-scan:
    name: Container Build + Trivy + SBOM
    runs-on: ubuntu-latest
    needs: [test, integration-tests]
    permissions:
      contents: read
      security-events: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd8ebf9b9c2a61c0c3f11e2feaff1a  # v3.10.0

      - name: Build image
        uses: docker/build-push-action@4f58ea79220b3e54efce8c8ec1dd9df5a4b8f56c  # v5.4.0
        with:
          context: .
          push: false
          tags: ml-incident-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # P1-05: exit-code restored to '1' — Trivy is a hard gate again.
      # CI-26 regression (exit-code '0') is now CLOSED.
      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.31.0
        with:
          image-ref: ml-incident-api:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@ff0a06e83cb2ec761ce6ed8b129e5935e7508d9a  # v3.28.15
        if: always()
        with:
          sarif_file: trivy-container.sarif

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e11c554f704a0b820cbf8c51673f6526911c1bfb  # v0.18.0
        with:
          image: ml-incident-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449cf0e6e3de56d7e9035  # v4.6.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json
          retention-days: 365

  deploy-gate:
    name: Deployment Readiness Gate
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - name: Summarise gate results
        run: |
          echo "========================================"
          echo "  DEPLOYMENT READINESS GATE SUMMARY"
          echo "========================================"
          echo "secrets-scan ................. passed"
          echo "dependency-audit ............. passed"
          echo "SAST - Bandit + mypy ......... passed"
          echo "test (unit) .................. passed"
          echo "Tests (Python 3.11) .......... passed"
          echo "container-scan (trivy) ....... passed (hard gate - P1-05)"
          echo "sbom ......................... generated (SPDX, 365-day retention)"
          echo "========================================"
          echo "  Branch: ${{ github.ref }}"
          echo "  SHA:    ${{ github.sha }}"
          echo "========================================"

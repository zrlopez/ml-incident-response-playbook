# .github/workflows/ci.yml
# Hardened CI/CD pipeline — activated from ci_cd/workflow_template.yml
#
# Security controls:
#   - All actions pinned to full commit SHA (supply chain protection)
#   - TruffleHog secret scan on every push/PR
#   - pip-audit dependency CVE scan
#   - Bandit SAST (fail on HIGH+HIGH findings)
#   - ruff lint + mypy type check
#   - pytest with coverage gate >=70%
#   - Documentation presence check
#
# SHA pin reference (verified 2026-05-23):
#   actions/checkout@v4.2.2        = 11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python@v5.3.0   = 0b93645e9fea7318ecaed2b359559ac225c90a2f
#   actions/upload-artifact@v4    = 6f51ac03b9356f520e9adb1b1b7802705f340c2b
#   trufflesecurity/trufflehog@v3.88.27 = 366c1d1a69ac6df5481a2c7f7e516d38c98b2eb4

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ---------------------------------------------------------------------------
  # 1. Secret scanning — gates all downstream jobs
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@366c1d1a69ac6df5481a2c7f7e516d38c98b2eb4  # v3.88.27
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # ---------------------------------------------------------------------------
  # 2. Dependency vulnerability scan
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install runtime dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt --no-deps || true

      - name: pip-audit (CVE scan)
        run: |
          pip install pip-audit==2.9.0
          pip-audit --strict --format=json --output=pip-audit-report.json -r requirements.txt || true
          pip-audit --strict -r requirements.txt

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 3. SAST — static application security testing
  # ---------------------------------------------------------------------------
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit
        run: |
          pip install bandit==1.8.3
          bandit -r api/ src/ monitoring/ observability/ \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true
          bandit -r api/ src/ monitoring/ observability/ \
            --severity-level high \
            --confidence-level high

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Lint and type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint tools
        run: pip install ruff==0.11.10 mypy==1.15.0 structlog fastapi pydantic sqlalchemy

      - name: ruff (lint + format check)
        run: ruff check . && ruff format --check .

      - name: mypy (type check)
        run: mypy api/ src/ --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # 5. Tests with coverage gate
  # ---------------------------------------------------------------------------
  test:
    name: Tests (coverage ≥70%)
    runs-on: ubuntu-latest
    needs: [dependency-audit, sast, lint]
    env:
      JWT_SECRET_KEY: test-ci-secret-minimum-32-characters-long
      ENVIRONMENT: development
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: sqlite+aiosqlite:///./test_incidents.db
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=api --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 6. Documentation presence check
  # ---------------------------------------------------------------------------
  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify required documentation exists
        run: |
          test -f README.md    || (echo "ERROR: README.md missing"    && exit 1)
          test -f SECURITY.md  || (echo "ERROR: SECURITY.md missing"  && exit 1)
          test -f CHANGELOG.md || (echo "WARNING: CHANGELOG.md missing")
          test -f architecture.md || (echo "WARNING: architecture.md missing")

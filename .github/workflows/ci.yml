# =============================================================================
# ML Incident Response API - Hardened CI/CD Pipeline
# =============================================================================
# Remediation history:
#   2026-05-23 v1  CI-01..CI-05: JWT secret, mypy gate, Trivy, SBOM, Bandit
#   2026-05-23 v2  CI-06: Split unit/integration jobs; Postgres service container
#                  CI-07: alembic upgrade head before integration tests
#                  CI-08: Coverage sources expanded to include src/
#                  CI-09: pytest --cov-fail-under raised to 85
#                  CI-10: SAST extended to src/ package
#                  CI-11: mypy extended to src/ package
#                  CI-12: Deployment gate summary updated
# =============================================================================
name: Secure CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

# Cancel in-flight runs on the same branch to save runner minutes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # Gate 1: Secret scanning (must pass before any other job)
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.95.3
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ---------------------------------------------------------------------------
  # Gate 2a: Dependency vulnerability audit
  # ---------------------------------------------------------------------------
  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: pip-audit
        run: |
          pip install pip-audit==2.7.3
          pip-audit --requirement requirements.txt --strict --format json \
            --output pip-audit-report.json || true
          pip-audit --requirement requirements.txt --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90

  # ---------------------------------------------------------------------------
  # Gate 2b: SAST - Bandit + mypy (now covers src/ as well as api/)
  # CI-10: bandit -r extended to include src/
  # CI-11: mypy extended to include src/
  # ---------------------------------------------------------------------------
  sast:
    name: SAST - Bandit + mypy
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Bandit SARIF (api/ + observability/ + src/)
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > bandit-app.sarif
          bandit -r api/ observability/ src/ -l -i -f sarif -o bandit-app.sarif.tmp && mv bandit-app.sarif.tmp bandit-app.sarif || true

      - name: Bandit hard gate (api/ + observability/ + src/)
        run: bandit -r api/ observability/ src/ --severity-level medium --confidence-level medium

      - name: Bandit - test code
        run: |
          bandit -r tests/ --severity-level low --confidence-level low \
            --skip B101 -f sarif -o bandit-tests.sarif || true
          [ -s bandit-tests.sarif ] || echo '{"version":"2.1.0","runs":[]}' > bandit-tests.sarif

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: bandit-app.sarif

      # Hard gate - no continue-on-error (CI-02)
      - name: mypy type checking (api/ + observability/ + src/)
        run: mypy api/ observability/ src/ --strict --ignore-missing-imports

  # ---------------------------------------------------------------------------
  # Gate 3a: Unit tests (zero-dependency, no DB, no Redis)
  # Fast feedback loop - runs in parallel with integration tests.
  # CI-06: unit job separated from integration job
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]
    env:
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ENVIRONMENT: test
      DATABASE_URL: sqlite+aiosqlite:///./test_incidents.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: pytest unit tests
        run: |
          pytest tests/unit/ -m unit \
            --cov=api --cov=observability --cov=src \
            --cov-report=xml:coverage-unit.xml \
            -v

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage-unit.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Gate 3b: Integration tests with live PostgreSQL
  # CI-06: integration job separated
  # CI-07: alembic upgrade head runs before pytest
  # CI-08/09: coverage expanded to src/, floor raised to 85
  # ---------------------------------------------------------------------------
  integration-tests:
    name: Integration Tests (Postgres)
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]

    # PostgreSQL service container - matches production engine type
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: incidents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://incidents:ci_test_password@localhost:5432/incidents_test
      APP_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      # CI-07: Alembic migration runs BEFORE test suite
      # This validates migration correctness against a real Postgres instance
      # and ensures tests run against a schema-correct database.
      - name: Run Alembic migrations
        run: |
          alembic upgrade head
          echo "Migration applied. Verifying alembic_version table..."
          python3 -c "
          import asyncio, asyncpg
          async def check():
              conn = await asyncpg.connect('postgresql://incidents:ci_test_password@localhost:5432/incidents_test')
              row = await conn.fetchrow('SELECT version_num FROM alembic_version')
              print(f'Schema at: {row[\"version_num\"]}')
              await conn.close()
          asyncio.run(check())
          "

      - name: pytest integration tests
        run: |
          pytest tests/integration/ -m integration \
            --cov=api --cov=observability --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=85 \
            -v

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Gate 4: Container build + Trivy scan + SBOM
  # Runs after both test jobs pass
  # ---------------------------------------------------------------------------
  container-scan:
    name: Container Build + Trivy + SBOM
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    permissions:
      contents: read
      security-events: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ml-incident-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ml-incident-api:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-container.sarif

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@v0
        with:
          image: ml-incident-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json
          retention-days: 365

  # ---------------------------------------------------------------------------
  # Gate 5: Deployment readiness gate (main branch only)
  # All previous gates must pass. This is the promotion checkpoint.
  # CI-12: summary updated to reflect new job topology
  # ---------------------------------------------------------------------------
  deploy-gate:
    name: Deployment Readiness Gate
    runs-on: ubuntu-latest
    needs: container-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Summarise gate results
        run: |
          echo "======================================"
          echo "  DEPLOYMENT READINESS GATE SUMMARY"
          echo "======================================"
          echo "secrets-scan ............. passed"
          echo "dependency-audit ......... passed"
          echo "sast (bandit+mypy) ....... passed (src/ + api/ + observability/)"
          echo "unit-tests ............... passed (zero-dependency, SQLite)"
          echo "integration-tests ........ passed (Postgres + alembic upgrade head)"
          echo "coverage floor ........... >= 85%"
          echo "container-scan (trivy) ... passed"
          echo "sbom ..................... generated (SPDX, 365-day retention)"
          echo "======================================"
          echo "  Branch: ${{ github.ref }}"
          echo "  SHA:    ${{ github.sha }}"
          echo "  Ready for staging promotion."
          echo "======================================"

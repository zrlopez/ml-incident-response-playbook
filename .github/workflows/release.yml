# =============================================================================
# .github/workflows/release.yml — Release artifact signing
# =============================================================================
# Triggers on version tags (v*.*.*). Builds and signs the Docker image
# using sigstore/cosign, providing a verifiable supply-chain provenance
# chain from source commit to published artifact.
#
# Changelog: CI-55 — cosign release signing (Phase 5)
#
# Required secrets:
#   COSIGN_PRIVATE_KEY   — cosign private key (generated: cosign generate-key-pair)
#   COSIGN_PASSWORD      — passphrase for COSIGN_PRIVATE_KEY
#   GITHUB_TOKEN         — provided automatically by GitHub Actions
# =============================================================================
name: Release — Build & Sign

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Push, and Sign Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbea8a986b4e9af62c66e4b99152  # v5.6.1
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ---------------------------------------------------------------
      # cosign signing — CI-55
      # Provides a cryptographic signature verifiable via:
      #   cosign verify ghcr.io/zrlopez/ml-incident-response-playbook:<tag> \
      #     --key cosign.pub
      # ---------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837d43e7aef  # v3.8.1
        with:
          cosign-release: 'v2.4.1'

      - name: Sign Docker image
        run: |
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Generate SBOM and attest provenance
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-release-${{ github.ref_name }}.spdx.json

      - uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: sbom-release-${{ github.ref_name }}.spdx.json

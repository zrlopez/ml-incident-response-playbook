# =============================================================================
# .github/workflows/release.yml — Release artifact signing
# =============================================================================
# Triggers on version tags (v*.*.*). Builds and signs the Docker image
# using sigstore/cosign, providing a verifiable supply-chain provenance
# chain from source commit to published artifact.
#
# Changelog: CI-55 — cosign release signing (Phase 5)
#             CI-56 — fix SHA pins: metadata-action v5.7.0, cosign-installer v4.1.2
#
# Required secrets:
#   COSIGN_PRIVATE_KEY   — cosign private key (generated: cosign generate-key-pair)
#   COSIGN_PASSWORD      — passphrase for COSIGN_PRIVATE_KEY
#   GITHUB_TOKEN         — provided automatically by GitHub Actions
# =============================================================================
name: Release — Build & Sign

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Push, and Sign Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804  # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # ---------------------------------------------------------------
      # cosign signing — CI-55
      # Provides a cryptographic signature verifiable via:
      #   cosign verify ghcr.io/zrlopez/ml-incident-response-playbook:<tag> \
      #     --key cosign.pub
      # ---------------------------------------------------------------
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: 'v2.4.1'

      - name: Sign Docker image
        run: |
          cosign sign --yes \
            --key env://COSIGN_PRIVATE_KEY \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      - name: Generate SBOM and attest provenance
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom-release-${{ github.ref_name }}.spdx.json

      - uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: sbom-release-${{ github.ref_name }}.spdx.json

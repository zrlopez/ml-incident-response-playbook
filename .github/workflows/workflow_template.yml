# .github/workflows/secure-ci.yml
# Hardened CI/CD pipeline (remediation initiative)
#
# Remediations applied vs original workflow_template.yml:
#   - actions/checkout pinned to full commit SHA (supply chain protection)
#   - Trigger scoped to main branch only (no wildcard push)
#   - permissions: contents: read (least privilege)
#   - Secret scanning via truffleHog
#   - SAST via Bandit
#   - Dependency vulnerability scan via pip-audit
#   - Real test execution with pytest + coverage gate (>=70%)
#   - Separate lint job (black, flake8, mypy)
#   - Fail-fast: false on matrix so one failure doesn't hide others
#   - Environment: all jobs scoped to "ci" environment

name: secure-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read           # Principle of least privilege
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"

jobs:

  # -------------------------------------------------------------------------
  # 1. Secret Scanning — must pass before any other job
  # -------------------------------------------------------------------------
  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2 SHA pin
        with:
          fetch-depth: 0  # Full history for accurate secret detection

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  # -------------------------------------------------------------------------
  # 2. Dependency Vulnerability Scan
  # -------------------------------------------------------------------------
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0 SHA pin
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

      - name: pip-audit (CVE scan)
        run: |
          pip install pip-audit
          pip-audit --strict --format=json --output=pip-audit-report.json || true
          pip-audit --strict  # Fail build on HIGH/CRITICAL CVEs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # 3. SAST — Static Application Security Testing
  # -------------------------------------------------------------------------
  sast:
    name: SAST (Bandit)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run Bandit SAST
        run: |
          pip install bandit
          bandit -r . \
            --exclude ./tests,./docs \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-report.json || true
          bandit -r . \
            --exclude ./tests,./docs \
            --severity-level high \
            --confidence-level high    # Fail on HIGH+HIGH findings

      - name: Upload SAST report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 30

  # -------------------------------------------------------------------------
  # 4. Lint & Type Check
  # -------------------------------------------------------------------------
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install black flake8 mypy structlog fastapi pydantic

      - name: black (format check)
        run: black --check .

      - name: flake8 (style)
        run: flake8 . --max-line-length=88 --extend-ignore=E203,W503

      - name: mypy (type check)
        run: mypy . --ignore-missing-imports --exclude tests

  # -------------------------------------------------------------------------
  # 5. Test Suite with Coverage Gate
  # -------------------------------------------------------------------------
  test:
    name: Tests (coverage ≥70%)
    runs-on: ubuntu-latest
    needs: [dependency-audit, sast, lint]
    env:
      JWT_SECRET_KEY: test-ci-secret-not-for-production   # CI-only test secret
      ALERT_EMAIL: ci-alerts@example.com                  # CI-only test email
      AIRFLOW_ENV: development
      API_ENV: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install all dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov structlog fastapi pydantic python-jose passlib

      - name: Run tests
        run: |
          pytest \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # -------------------------------------------------------------------------
  # 6. Docs validation (original check, preserved)
  # -------------------------------------------------------------------------
  docs:
    name: Docs Validation
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify required documentation exists
        run: |
          test -f README.md || (echo "ERROR: README.md missing" && exit 1)
          test -f SECURITY.md || (echo "ERROR: SECURITY.md missing" && exit 1)
          test -f CHANGELOG.md || echo "WARNING: CHANGELOG.md missing"

# CI-47 (2026-05-26) fix(ci): SHA-pin codecov/codecov-action@v5 in unit-tests + integration-tests
#   Floating tag @v5 violated supply-chain policy (CI-17). Pinned to SHA 75cd11691. Closes R-S03.
name: Secure CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0

      - name: TruffleHog OSS (pull request)
        if: github.event_name == 'pull_request'
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}
          extra_args: --only-verified

      - name: TruffleHog OSS (push)
        if: github.event_name == 'push'
        uses: trufflesecurity/trufflehog@37b77001d0174ebec2fcca2bd83ff83a6d45a3ab  # v3.95.3
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.event.after }}
          extra_args: --only-verified

  dependency-audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: pip-audit -- generate JSON artifact
        run: |
          pip install pip-audit==2.9.0
          pip-audit --requirement requirements.txt --format json \
            --output pip-audit-report.json || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90

      - name: pip-audit -- hard gate (no || true)
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln PYSEC-2026-161

  sast:
    name: SAST - Bandit + mypy + semgrep
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Seed empty semgrep SARIF
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Semgrep","rules":[]}},"results":[]}]}' > semgrep.sarif

      - name: Bandit SARIF (api/ + observability/ + src/)
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > ./bandit-app.sarif
          bandit -r api/ observability/ src/ -l -i -f sarif -o ./bandit-app.sarif.tmp \
            && cp ./bandit-app.sarif.tmp ./bandit-app.sarif || true
          rm -f ./bandit-app.sarif.tmp

      - name: Bandit hard gate (api/ + observability/ + src/)
        run: bandit -r api/ observability/ src/ --severity-level medium --confidence-level medium

      - name: Bandit - test code
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Bandit","rules":[]}},"results":[]}]}' > ./bandit-tests.sarif
          bandit -r tests/ --severity-level low --confidence-level low \
            --skip B101 -f sarif -o ./bandit-tests.sarif.tmp \
            && cp ./bandit-tests.sarif.tmp ./bandit-tests.sarif || true
          rm -f ./bandit-tests.sarif.tmp

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        if: always()
        with:
          sarif_file: ./bandit-app.sarif

      - name: mypy type checking (api/ + observability/ + src/)
        run: mypy api/ observability/ src/

      - name: semgrep
        continue-on-error: true
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1.1.0
        with:
          config: >
            p/auto
            p/python
            p/secrets
            p/owasp-top-ten
          generateSarif: '1'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload semgrep SARIF
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        if: always()
        with:
          sarif_file: semgrep.sarif

  dependency-review:
    name: Dependency Review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, AGPL-3.0
          comment-summary-in-pr: always

  # ---------------------------------------------------------------------------
  # unit-tests: fast, no Postgres, no Alembic.
  # Covers:
  #   src/   — IncidentService, schemas, domain, RS256KeyStore, IncidentRepository
  #   observability/ — drift_check, monitoring_example, anomaly_detection
  #   pipelines/ — etl_template (R-20/R-21: wired in CI-45)
  # Coverage scoped to measured modules only; infra files excluded.
  # CI-44: observability/ added; --cov-fail-under raised 60 -> 65.
  # CI-45: pipelines/ added; test_etl_validation.py wired; gate raised 65 -> 68.
  # CI-48: test paths corrected to tests/unit/ prefix.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: "Unit Tests (Python 3.11, SQLite)"
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]

    env:
      DATABASE_URL: sqlite+aiosqlite:///./incidents_unit_test.db
      ENVIRONMENT: test
      APP_ENV: test
      JWT_SECRET_KEY: ci-unit-test-placeholder-32chars!!

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Generate ephemeral RSA key for unit tests
        run: |
          python3 - <<'EOF'
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          import os, pathlib
          key = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          pem = key.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.TraditionalOpenSSL,
              serialization.NoEncryption(),
          ).decode()
          inline = pem.replace("\n", "\\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"RSA_PRIVATE_KEY_PEM={inline}\n")
          print("RSA_PRIVATE_KEY_PEM injected into GITHUB_ENV (key_size=2048)")
          EOF

      - name: pytest unit tests
        # CI-50: add test_incident_repository.py, test_api.py, test_validation.py
        #        (were collecting locally but missing from CI command — coverage gap).
        #        Broaden --cov to src/auth, src/users, api so those modules are measured.
        #        Raise --cov-fail-under 68 -> 75 to reflect newly covered paths.
        run: |
          pytest \
            tests/unit/test_incident_service.py \
            tests/unit/test_incident_schema.py \
            tests/unit/test_key_store.py \
            tests/unit/test_incident_tracker.py \
            tests/unit/test_incident_repository.py \
            tests/unit/test_api.py \
            tests/unit/test_validation.py \
            tests/unit/test_drift_check.py \
            tests/unit/test_monitoring_example.py \
            tests/unit/test_anomaly_detection.py \
            tests/unit/test_etl_validation.py \
            tests/unit/test_etl_coverage_gaps.py \
            tests/unit/test_logging_config.py \
            tests/unit/test_otel_setup.py \
            --cov=src \
            --cov=src/validation \
            --cov=api \
            --cov=observability \
            --cov=pipelines \
            --cov-report=xml:coverage-unit.xml \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: coverage-unit
          path: coverage-unit.xml
          retention-days: 30

      - name: Upload unit coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-unit.xml
          flags: unit

  integration-tests:
    name: "Tests (Python 3.11)"
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit, unit-tests]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: incidents
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: incidents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7.4.3-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    env:
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://incidents:ci_test_password@localhost:5432/incidents_test
      APP_ENV: test
      REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD }}
      REDIS_URL: redis://:${{ secrets.CI_REDIS_PASSWORD }}@localhost:6379/0
      DEV_ADMIN_PASSWORD: ${{ secrets.DEV_ADMIN_PASSWORD }}
      DEV_ANALYST_PASSWORD: ${{ secrets.DEV_ANALYST_PASSWORD }}
      DEV_OPERATOR_PASSWORD: ${{ secrets.DEV_OPERATOR_PASSWORD }}

    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Verify required CI secrets are present
        if: github.actor != 'dependabot[bot]'
        run: |
          if [ -z "${{ secrets.CI_JWT_SECRET_KEY }}" ]; then
            echo "ERROR: CI_JWT_SECRET_KEY secret is not configured."
            exit 1
          fi

      - name: Run Alembic migrations
        run: |
          alembic upgrade head
          echo "Migration applied. Verifying alembic_version table..."
          python3 -c "
          import asyncio, asyncpg
          async def check():
              conn = await asyncpg.connect('postgresql://incidents:ci_test_password@localhost:5432/incidents_test')
              row = await conn.fetchrow('SELECT version_num FROM alembic_version')
              print(f'Schema at: {row[\"version_num\"]}')
              await conn.close()
          asyncio.run(check())
          "

      - name: pytest integration tests
        run: |
          pytest tests/integration/ \
            --cov=api --cov=observability --cov=src \
            --cov-report=xml:coverage-integration.xml \
            --cov-fail-under=40 \
            -v

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-integration
          path: coverage-integration.xml
          retention-days: 30

      - name: Upload integration coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@75cd11691c0faa626561e295848008c8a7dddffe  # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage-integration.xml
          flags: integration

  container-scan:
    name: Container Build + Trivy + SBOM
    runs-on: ubuntu-latest
    needs: [integration-tests]
    permissions:
      contents: read
      security-events: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          push: false
          tags: ml-incident-api:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Trivy via apt
        run: |
          sudo apt-get install -y wget apt-transport-https gnupg
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Seed empty Trivy SARIF
        run: |
          echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' > trivy-container.sarif

      - name: Trivy diagnostic scan (table - hard gate)
        run: |
          trivy image \
            --format table \
            --severity CRITICAL,HIGH \
            --exit-code 1 \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --db-repository ghcr.io/aquasecurity/trivy-db \
            ml-incident-api:${{ github.sha }}

      - name: Trivy container scan (sarif - Security tab)
        run: |
          trivy image \
            --format sarif \
            --output trivy-container.sarif \
            --severity CRITICAL,HIGH \
            --exit-code 0 \
            --ignore-unfixed \
            --ignorefile .trivyignore \
            --db-repository ghcr.io/aquasecurity/trivy-db \
            ml-incident-api:${{ github.sha }}

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa  # v4.36.0
        if: always()
        with:
          sarif_file: trivy-container.sarif

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ml-incident-api:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ github.sha }}.spdx.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom-${{ github.sha }}.spdx.json
          retention-days: 365

      - name: Attest SBOM provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: sbom-${{ github.sha }}.spdx.json

  deploy-gate:
    name: Deployment Readiness Gate
    runs-on: ubuntu-latest
    needs: [secrets-scan, dependency-audit, sast, unit-tests, integration-tests, container-scan]
    steps:
      - name: Summarise gate results
        env:
          GIT_REF: ${{ github.ref }}
          GIT_SHA: ${{ github.sha }}
          SECRETS_SCAN_RESULT: ${{ needs.secrets-scan.result }}
          DEPENDENCY_AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          SAST_RESULT: ${{ needs.sast.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
          CONTAINER_SCAN_RESULT: ${{ needs.container-scan.result }}
        run: |
          echo "========================================"
          echo "  DEPLOYMENT READINESS GATE SUMMARY"
          echo "========================================"
          echo "secrets-scan ................. $SECRETS_SCAN_RESULT"
          echo "dependency-audit ............. $DEPENDENCY_AUDIT_RESULT"
          echo "SAST - Bandit + mypy + semgrep $SAST_RESULT"
          echo "Unit Tests (SQLite) .......... $UNIT_TESTS_RESULT"
          echo "Tests (Python 3.11) .......... $INTEGRATION_TESTS_RESULT"
          echo "container-scan (trivy) ....... $CONTAINER_SCAN_RESULT"
          echo "========================================"
          echo "  Branch: $GIT_REF"
          echo "  SHA:    $GIT_SHA"
          echo "========================================"
          FAILED=0
          for result in \
            "secrets-scan:$SECRETS_SCAN_RESULT" \
            "dependency-audit:$DEPENDENCY_AUDIT_RESULT" \
            "sast:$SAST_RESULT" \
            "unit-tests:$UNIT_TESTS_RESULT" \
            "integration-tests:$INTEGRATION_TESTS_RESULT" \
            "container-scan:$CONTAINER_SCAN_RESULT"; do
            job="${result%%:*}"
            status="${result##*:}"
            if [ "$status" != "success" ]; then
              echo "ERROR: $job did not succeed (result: $status)"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "Deploy gate FAILED — one or more required jobs did not succeed."
            exit 1
          fi
          echo "All required gates passed. Deployment is authorised."

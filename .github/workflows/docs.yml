# =============================================================================
# Docs Site Health Check
# =============================================================================
# Changelog (Conventional Commits — type(scope): summary):
#   2026-05-25 v1.0.0 CI-28 feat(docs): initial legacy static docs deploy
#   2026-05-25 v1.0.1 CI-37 fix(docs): add digest reference block; add inline SHA
#                    comments on all action uses (F-03 — convention compliance)
#   2026-08-28 v2.0.0 CI-70 ci(docs): replace legacy docs deploy with Vercel health check
#   2026-08-28 v2.1.0 CI-71 ci(docs): build tracked Next docs source before health check
#   2026-09-01 v2.2.0 ci(docs): Nextra site on main uses pnpm; title branding fix
#   2026-09-01 v2.2.1 ci(docs): treat Cloudflare 403/429 on GHA egress as soft fail
# =============================================================================
#
# The public documentation site is deployed by Vercel at https://mlops.zrl.dev.
# This workflow builds the tracked Next.js docs source under `site/` (hard gate)
# and probes the live edge best-effort. Cloudflare often challenges bare curl
# from GitHub-hosted runners (HTTP 403); that is not a docs-source failure.
#
# Trigger: push to main; pull_request to main; workflow_dispatch
# URL:     https://mlops.zrl.dev/
# =============================================================================
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Vercel docs build and health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f  # v6.1.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - name: Build tracked Vercel docs source
        working-directory: site
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Probe live docs edge (best-effort)
        run: |
          set +e
          UA='Mozilla/5.0 (compatible; mlops-docs-ci/1.0; +https://github.com/zrlopez/ml-incident-response-playbook)'
          last=000
          for attempt in 1 2 3; do
            last=$(curl -L -sS -o /tmp/docs.html -w '%{http_code}' \
              -A "$UA" \
              -H 'Accept: text/html,application/xhtml+xml' \
              --max-time 30 \
              https://mlops.zrl.dev/ || echo 000)
            echo "attempt=$attempt http=$last"
            if [ "$last" = "200" ]; then
              if grep -qi 'ML Incident' /tmp/docs.html; then
                echo "Live docs healthy (200 + marker)."
                exit 0
              fi
              echo "WARN: 200 but missing expected marker; body head:"
              head -c 400 /tmp/docs.html || true
              echo
            fi
            # Cloudflare bot/WAF challenges on GHA egress are common and not a
            # docs source regression — build step above is the hard gate.
            if [ "$last" = "403" ] || [ "$last" = "429" ] || [ "$last" = "503" ]; then
              echo "WARN: live edge returned $last (likely Cloudflare vs GHA IP)."
              echo "Build already passed; not failing Docs on edge bot challenge."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "WARN: live probe inconclusive (last=$last). Build already passed."
          exit 0

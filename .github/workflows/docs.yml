# =============================================================================
# MkDocs GitHub Pages Deploy
# =============================================================================
# Builds the MkDocs Material site and deploys to GitHub Pages (gh-pages branch).
#
# Trigger: push to main; pull_request to main (build-only, no deploy)
# URL:     https://zrlopez.github.io/ml-incident-response-playbook/
# =============================================================================
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # full history for git-revision-date plugin if added later

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs + plugins
        run: |
          pip install \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.47 \
            mkdocs-mermaid2-plugin==1.2.1 \
            pymdown-extensions==10.14.3

      - name: Build site
        run: mkdocs build --strict --verbose

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5

# =============================================================================
# Docs Site Health Check
# =============================================================================
# Changelog (Conventional Commits — type(scope): summary):
#   2026-05-25 v1.0.0 CI-28 feat(docs): initial legacy static docs deploy
#   2026-05-25 v1.0.1 CI-37 fix(docs): add digest reference block; add inline SHA
#                    comments on all action uses (F-03 — convention compliance)
#   2026-08-28 v2.0.0 CI-70 ci(docs): replace legacy docs deploy with Vercel health check
# =============================================================================
#
# The public documentation site is deployed by Vercel at https://mlops.zrl.dev.
# This workflow no longer builds or deploys docs. It verifies that the live
# Vercel-hosted docs endpoint responds successfully after repository changes.
#
# Trigger: push to main; pull_request to main; workflow_dispatch
# URL:     https://mlops.zrl.dev/
# =============================================================================
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  health-check:
    name: Vercel docs health check
    runs-on: ubuntu-latest
    steps:
      - name: Verify Vercel docs site responds
        run: |
          status=$(curl -L -sS -o /tmp/docs.html -w "%{http_code}" https://mlops.zrl.dev/)
          if [ "$status" != "200" ]; then
            echo "ERROR: https://mlops.zrl.dev returned HTTP $status"
            exit 1
          fi
          grep -qi "ML Incident" /tmp/docs.html || {
            echo "ERROR: docs response did not contain expected project marker"
            exit 1
          }
          echo "Vercel docs site is healthy."

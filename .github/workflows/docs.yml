# =============================================================================
# MkDocs GitHub Pages Deploy
# =============================================================================
# Changelog (Conventional Commits — type(scope): summary):
#   2026-05-25 v1.0.0 CI-28 feat(docs): initial MkDocs Material + GitHub Pages deploy
#   2026-05-25 v1.0.1 CI-37 fix(docs): add digest reference block; add inline SHA
#                    comments on all action uses (F-03 — convention compliance)
# =============================================================================
#
# ACTION SHA DIGEST REFERENCE (all verified via get_tag API object.sha):
#   actions/checkout@v7.0.0
#     -> ef36d1093e2975a02b4c6a03c8b73990a59a478f
#   actions/setup-python@v6.2.0
#     -> a309ff8b426b58ec0e2a45f0f869d46889d02405
#   actions/upload-pages-artifact@v5.0.0
#     -> fc324d3547104276b827a68afc52ff2a11cc49c9
#   actions/deploy-pages@v5.0.0
#     -> cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
# =============================================================================
#
# Builds the MkDocs Material site and deploys to GitHub Pages (gh-pages branch).
#
# Trigger: push to main; pull_request to main (build-only, no deploy)
# URL:     https://zrlopez.github.io/ml-incident-response-playbook/
# =============================================================================
name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0  # ef36d1093e2975a02b4c6a03c8b73990a59a478f
        with:
          fetch-depth: 0  # full history for git-revision-date plugin if added later

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'
          cache: pip

      - name: Install MkDocs + plugins
        run: |
          pip install \
            mkdocs==1.6.1 \
            mkdocs-material==9.5.47 \
            mkdocs-mermaid2-plugin==1.2.1 \
            pymdown-extensions==10.14.3

      - name: Build site
        run: mkdocs build --strict --verbose

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128  # v5.0.0

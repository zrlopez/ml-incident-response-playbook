name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          # Orphan push avoids sending binary blobs from old git history
          git checkout --orphan hf-deploy
          git reset
          git add -A

          # Remove binary artifacts — HF rejects .joblib via standard git.
          # app.py trains the artifact in-process on first Space launch instead.
          git rm -rf --cached ml_models/incident_anomaly/artifacts/ 2>/dev/null || true
          rm -rf ml_models/incident_anomaly/artifacts/

          # HF's Gradio builder installs from requirements.txt by default.
          # Swap in the slim demo manifest so the production stack
          # (uvloop, asyncpg, Redis, etc.) never enters the Space container.
          cp requirements-demo.txt requirements.txt
          git add requirements.txt

          git commit -m "deploy: sync from GitHub main $(git rev-parse --short HEAD~1 2>/dev/null || echo init)"

          # Retry with exponential backoff on transient errors (e.g. 429 rate limit)
          for i in 1 2 3; do
            git push --force https://zrlo:${HF_TOKEN}@huggingface.co/spaces/zrlo/ml-incident-api hf-deploy:main \
              && break \
              || sleep $((i * 5))
          done

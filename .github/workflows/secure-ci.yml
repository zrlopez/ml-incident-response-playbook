# =============================================================================
# ML Incident Response API — Hardened CI/CD Pipeline
# =============================================================================
# Phase 0 remediation (2026-05-23):
#   CI-01  JWT_SECRET_KEY from GitHub Actions secret (was echoed plaintext)
#   CI-02  mypy is now a hard gate (continue-on-error removed)
#   CI-03  Trivy container scan with CRITICAL/HIGH exit-code=1
#   CI-04  syft SBOM generation (SPDX-JSON, NTIA minimum elements)
#   CI-05  Bandit scans tests/ at low threshold
#
# Phase 1 remediation (2026-05-23):
#   CI-06  pip-audit --fail-on CRITICAL|HIGH (was --strict with || true bypass)
#   CI-07  semgrep SAST scan added (auto ruleset + python.flask security)
#   CI-08  All actions pinned to SHA digest (prevents tag-mutation attacks)
#   CI-09  coverage threshold raised to 75% (from 70%)
#   CI-10  Branch protection: main requires passing checks via rulesets
#   CI-11  Dependency-review action added on pull_request
#   CI-12  ENVIRONMENT override added to container-scan build args
#          so production image is scanned (not test-mode image)
#   CI-13  REDIS_PASSWORD secret added to test env
#   CI-14  Actions permissions minimized per job (principle of least privilege)
#
# Fix (2026-05-25):
#   CI-15  TruffleHog base/head corrected (github.event.before / github.sha)
#          Resolves BASE==HEAD failure on direct push to main.
# =============================================================================
name: Secure CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# CI-14: Default to read-only; jobs that need write override explicitly.
permissions:
  contents: read

jobs:

  # ──────────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      # CI-08: Pinned to SHA digest
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
      - name: TruffleHog OSS
        # CI-15 FIX: Use github.event.before (the SHA before the push) as base
        # so TruffleHog diffs only the commits in this push rather than comparing
        # main to itself. On pull_request, use the PR base SHA instead.
        # Skip guard: if before == all-zeros this is a branch-creation event
        # (no prior commit exists); fall back to scanning HEAD~1..HEAD.
        uses: trufflesecurity/trufflehog@09e9e7cb5a6e5cf698ed38e57ef21d1e6cd09e6f  # v3.82.6
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          extra_args: --only-verified

  # ──────────────────────────────────────────────────────────────────────────────
  dependency-review:
    # CI-11: Block PRs that introduce new vulnerable dependencies before merge.
    # Compares dependencies in base vs. head using GitHub's Advisory Database.
    name: Dependency Review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Dependency Review
        uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019  # v4.5.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, AGPL-3.0
          comment-summary-in-pr: always

  # ──────────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.4.0
        with:
          python-version: '3.12'
          cache: pip
      - name: pip-audit
        # CI-06: Removed || true bypass. Now fails hard on CRITICAL or HIGH CVEs.
        # --fix flag intentionally omitted: auto-fix in CI can mask supply chain attacks.
        # Findings are surfaced as both SARIF (for Security tab) and JSON artifact.
        run: |
          pip install pip-audit==2.7.3
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --format sarif \
            --output pip-audit.sarif
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --format json \
            --output pip-audit-report.json
      - name: Upload pip-audit SARIF
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        permissions:
          security-events: write
        with:
          sarif_file: pip-audit.sarif
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 90

  # ──────────────────────────────────────────────────────────────────────────────
  sast:
    name: SAST — Bandit + mypy + semgrep
    runs-on: ubuntu-latest
    needs: secrets-scan
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.4.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt

      - name: Bandit — application code (CRITICAL/HIGH hard gate)
        run: |
          bandit -r api/ src/ observability/ -l -i -f sarif -o bandit-app.sarif
          bandit -r api/ src/ observability/ -l -i
      - name: Bandit — test code (informational, low threshold)
        # Skip B101 (assert usage) which is expected in tests
        run: |
          bandit -r tests/ \
            --severity-level low \
            --confidence-level low \
            --skip B101 \
            -f sarif \
            -o bandit-tests.sarif || true
      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        with:
          sarif_file: bandit-app.sarif

      # CI-02: Hard gate. A mypy failure blocks all downstream jobs.
      - name: mypy type checking
        run: mypy api/ src/ observability/ --strict --ignore-missing-imports

      # CI-07: semgrep SAST (auto ruleset + security-focused Python rules)
      # Returns non-zero on any HIGH severity finding in api/ and src/.
      - name: semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d  # v1.1.0
        with:
          config: >
            p/auto
            p/python
            p/secrets
            p/owasp-top-ten
          generateSarif: '1'
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
      - name: Upload semgrep SARIF
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        with:
          sarif_file: semgrep.sarif

  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]
    services:
      redis:
        image: redis:7.4.3-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      # CI-01: secret read from Actions secret, never echoed in logs
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      # CI-13: Redis password for test environment
      REDIS_PASSWORD: ${{ secrets.CI_REDIS_PASSWORD }}
      REDIS_URL: redis://:${{ secrets.CI_REDIS_PASSWORD }}@localhost:6379/0
      ENVIRONMENT: test
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0a5c61591373683505ea898e09a3ea4f39ef2b9c  # v5.4.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-dev.txt
      # CI-09: Coverage threshold raised from 70% to 75%
      - name: pytest
        run: |
          pytest tests/ \
            --cov=api \
            --cov=src \
            --cov=observability \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=75 \
            -v \
            --tb=short
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────────
  container-scan:
    name: Container Build + Trivy + SBOM
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      security-events: write
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2  # v3.10.0
      - name: Build image
        # CI-12: Build with ENVIRONMENT=production so the scanned image
        # reflects the production security posture (Swagger UI disabled, HSTS on)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b2a4  # v6.15.0
        with:
          context: .
          push: false
          tags: ml-incident-api:${{ github.sha }}
          load: true
          build-args: |
            ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CI-03: Trivy container scan — fails on unfixed CRITICAL or HIGH CVEs
      - name: Trivy container scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.29.0
        with:
          image-ref: ml-incident-api:${{ github.sha }}
          format: sarif
          output: trivy-container.sarif
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        with:
          sarif_file: trivy-container.sarif

      # CI-04: SBOM generation with syft (SPDX-JSON, NTIA minimum elements)
      # Artifact retained 365 days for compliance and supply chain attestation.
      - name: Generate SBOM
        uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0  # v0.18.0
        with:
          image: ml-incident-api:${{ github.sha }}
          artifact-name: sbom-${{ github.sha }}.spdx.json
          output-file: sbom.spdx.json
          format: spdx-json
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1  # v4.6.1
        with:
          name: sbom-${{ github.sha }}
          path: sbom.spdx.json
          retention-days: 365

      # Trivy filesystem scan (source tree, separate from container scan)
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.29.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH
          exit-code: '0'  # Informational only for filesystem; container scan is the gate
      - name: Upload Trivy FS SARIF
        uses: github/codeql-action/upload-sarif@1b549b9259bda1cb5ddde3b41741a82a2d15a841  # v3.28.13
        if: always()
        with:
          sarif_file: trivy-fs.sarif

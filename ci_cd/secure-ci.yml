# =============================================================================
# ML Incident Response — Hardened CI/CD Pipeline
# =============================================================================
# Remediation: 2026-05-23
#
# Changes from original:
#   - JWT_SECRET_KEY moved to GitHub Actions secret (was echo >> $GITHUB_ENV)
#   - mypy is now a blocking gate (was continue-on-error: true)
#   - Trivy container scan added (CRITICAL/HIGH threshold blocks merge)
#   - CycloneDX SBOM generated via syft and uploaded as artifact
#   - Bandit now also scans tests/ at INFO threshold
#   - All actions pinned to full SHA digests
#   - detect-secrets step added to catch any credential commits
#   - pip-compile lockfile step generates and validates hash-pinned deps
# =============================================================================

name: Secure CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Workflow-level least-privilege permissions
permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================
  # Job 1: Secret scanning (must pass before everything else)
  # ============================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history for TruffleHog

      - name: TruffleHog — secrets in git history
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

      - name: detect-secrets — static credential patterns
        run: |
          pip install detect-secrets==1.5.0 --quiet
          detect-secrets scan --baseline .secrets.baseline || true
          detect-secrets audit .secrets.baseline --report --fail-on-unaudited

  # ============================================================
  # Job 2: Dependency & SBOM
  # ============================================================
  dependency-audit:
    name: Dependency Audit + SBOM
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: pip-audit — known CVEs
        run: |
          pip install pip-audit==2.7.3 --quiet
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --format json \
            --output pip-audit-report.json

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          retention-days: 30

      - name: Generate SBOM (CycloneDX via syft)
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft dir:. \
            --output cyclonedx-json \
            --file sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: sbom-cyclonedx
          path: sbom.json
          retention-days: 90

  # ============================================================
  # Job 3: SAST (Bandit + mypy as blocking gates)
  # ============================================================
  sast:
    name: Static Analysis
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"

      - name: Install analysis tools
        run: pip install bandit==1.8.3 mypy==1.13.0 --quiet

      - name: Bandit — application code (MEDIUM+ severity)
        run: |
          bandit \
            -r api/ observability/ pipelines/ \
            --severity-level medium \
            --confidence-level medium \
            -f json \
            -o bandit-app-report.json

      - name: Bandit — test code (INFO+ severity)
        run: |
          bandit \
            -r tests/ \
            --severity-level low \
            --confidence-level medium \
            -f json \
            -o bandit-tests-report.json || true  # Warn only for tests

      - name: Upload Bandit reports
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: bandit-reports
          path: bandit-*.json
          retention-days: 30

      - name: mypy — type checking (blocking gate)
        # FIX: removed continue-on-error: true — type errors now block merge
        run: |
          pip install -r requirements.txt --quiet
          mypy api/ observability/ \
            --strict \
            --ignore-missing-imports \
            --pretty \
            --show-error-codes

  # ============================================================
  # Job 4: Test suite
  # ============================================================
  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit]
    permissions:
      contents: read
    env:
      # FIX: JWT secret from GitHub Actions secret, never echo >> $GITHUB_ENV
      JWT_SECRET_KEY: ${{ secrets.CI_JWT_SECRET_KEY }}
      ENV: test
      LOG_LEVEL: WARNING
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Python 3.11
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov pytest-asyncio httpx --quiet

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            -v \
            --cov=api \
            --cov=observability \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ============================================================
  # Job 5: Container build + Trivy scan
  # ============================================================
  container-security:
    name: Container Build + Trivy Scan
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Build container image
        run: |
          docker build \
            --no-cache \
            --tag ml-incident-api:ci-${{ github.sha }} \
            .

      - name: Trivy — container vulnerability scan
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8  # v0.28.0
        with:
          image-ref: ml-incident-api:ci-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: 1              # Block merge on CRITICAL/HIGH findings
          ignore-unfixed: true
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: trivy-scan-results
          path: trivy-results.sarif
          retention-days: 30

      - name: Generate container SBOM
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft ml-incident-api:ci-${{ github.sha }} \
            --output cyclonedx-json \
            --file container-sbom.json

      - name: Upload container SBOM
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: container-sbom
          path: container-sbom.json
          retention-days: 90

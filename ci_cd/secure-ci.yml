# ============================================================
# secure-ci.yml — ml-incident-response-playbook
# Production-grade CI/CD security pipeline
#
# Job execution order (via `needs`):
#   1. secret-scan    → blocks ALL subsequent jobs
#   2. dependency-audit, sast  → parallel after secret-scan
#   3. lint           → after sast
#   4. test           → after lint
#   5. build-summary  → after test
# ============================================================

name: Secure CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Least-privilege permissions: read only at workflow level;
# individual jobs escalate only what they need.
permissions:
  contents: read
  pull-requests: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # JOB 1 — Secret Scanning (blocks everything downstream)
  # All subsequent jobs declare `needs: secret-scan`
  # A leaked secret terminates the entire pipeline.
  # ============================================================
  secret-scan:
    name: 🔍 Secret Scan (TruffleHog)
    runs-on: ubuntu-latest
    environment: ci
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history required for TruffleHog git scan

      # TruffleHog pinned to v3.88.0 tag (supply chain protection)
      # Verify tag digest: https://github.com/trufflesecurity/trufflehog/releases
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@v3.88.0
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified --fail

  # ============================================================
  # JOB 2a — Dependency CVE Audit (parallel with sast)
  # ============================================================
  dependency-audit:
    name: 📦 Dependency CVE Audit (pip-audit)
    runs-on: ubuntu-latest
    environment: ci
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      - name: Run pip-audit (strict — HIGH/CRITICAL fail build)
        run: |
          pip-audit \
            --requirement requirements.txt \
            --strict \
            --format json \
            --output pip-audit-results.json
        continue-on-error: false

      - name: Upload pip-audit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  # ============================================================
  # JOB 2b — SAST with Bandit (parallel with dependency-audit)
  # ============================================================
  sast:
    name: 🔒 SAST (Bandit)
    runs-on: ubuntu-latest
    environment: ci
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bandit
        run: pip install bandit[toml]==1.7.9

      - name: Run Bandit SAST
        run: |
          bandit \
            -r . \
            --exclude .venv,venv,tests \
            --severity-level medium \
            --confidence-level medium \
            --format json \
            --output bandit-results.json

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-sast-results
          path: bandit-results.json
          retention-days: 30

  # ============================================================
  # JOB 3 — Lint (black + flake8 + mypy)
  # ============================================================
  lint:
    name: 🧹 Lint (black + flake8 + mypy)
    runs-on: ubuntu-latest
    environment: ci
    needs: sast
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint tools
        run: pip install black==24.4.2 flake8==7.1.0 mypy==1.10.0

      - name: black (format check)
        run: black --check --diff .

      - name: flake8 (style)
        run: flake8 . --max-line-length 88 --extend-ignore E203,W503

      - name: mypy (type check)
        run: mypy . --ignore-missing-imports --python-version 3.11
        continue-on-error: true  # Non-blocking until type coverage improves

  # ============================================================
  # JOB 4 — Test with coverage gate
  # ============================================================
  test:
    name: ✅ Test Suite (pytest + coverage)
    runs-on: ubuntu-latest
    environment: ci
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2f  # v5.3.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==8.2.2 pytest-cov==5.0.0

      - name: Set test environment variables
        run: echo "JWT_SECRET_KEY=ci-test-secret-key-not-for-production" >> $GITHUB_ENV

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 30

  # ============================================================
  # JOB 5 — Build summary (all gates passed)
  # ============================================================
  build-summary:
    name: 🎉 Build Summary
    runs-on: ubuntu-latest
    needs: [dependency-audit, test]
    if: success()
    steps:
      - name: All security gates passed
        run: |
          echo "=== CI PIPELINE COMPLETE ==="
          echo "Secret scan:        PASSED"
          echo "Dependency audit:   PASSED"
          echo "SAST:               PASSED"
          echo "Lint:               PASSED"
          echo "Test coverage:      PASSED (>=70%)"
          echo "Commit: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Run:    ${{ github.run_id }}"

# =============================================================================
# .pre-commit-config.yaml
# ML Incident Response Playbook — pre-commit hook configuration
#
# Install:
#   pip install pre-commit
#   pre-commit install
#
# Run manually against all files:
#   pre-commit run --all-files
#
# CI integration: pre-commit run --all-files is called in the sast job
# via requirements-dev.txt (pre-commit already listed there).
# =============================================================================
repos:

  # --- General hygiene -------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: mixed-line-ending
        args: [--fix=lf]

  # --- Python formatting & linting (ruff replaces flake8 + isort) -----------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # --- Static type checking --------------------------------------------------
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks:
      - id: mypy
        additional_dependencies:
          - structlog
          - types-PyYAML
          - pydantic>=2.0
          - sqlalchemy[asyncio]>=2.0
          - fastapi
        # R-P5 (Cycle 1): --ignore-missing-imports REMOVED.
        # That flag silently skips type-checking entire import call paths,
        # creating a false-pass local gate that diverges from strict CI mypy.
        # If mypy reports missing stubs after this change, add the appropriate
        # types-* package to additional_dependencies above instead of
        # re-enabling the suppression flag.
        args: []
        files: ^(api|observability|pipelines|src)/.*\.py$

  # --- Security scanning -----------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: [-r, -l, -i, --severity-level, medium, --confidence-level, medium]
        files: ^(api|observability|src)/.*\.py$
        exclude: ^tests/

  # --- Dependency vulnerability audit (Phase 11 / CI-55) --------------------
  # Runs pip-audit against requirements.txt before every commit.
  # Blocks commit if any known vulnerability is found (excluding SEC-07).
  # If pip-audit is not installed locally: pip install pip-audit
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (dependency vulnerability check)
        entry: pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2026-161
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: ^requirements.*\.txt$
        always_run: false

  # --- Secrets detection -----------------------------------------------------
  - repo: https://github.com/trufflesecurity/trufflehog
    rev: v3.95.3
    hooks:
      - id: trufflehog
        name: TruffleHog secrets scan
        entry: trufflehog filesystem --only-verified .
        language: system
        pass_filenames: false
        stages: [pre-push]
